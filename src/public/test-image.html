<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Dataset Explorer Mock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            height: 100vh;
            overflow: hidden;
            font-family: system-ui;
        }

        #sidebar {
            width: 280px;
            border-right: 1px solid #ddd;
            overflow: auto;
            padding: 10px;
            background: #fafafa;
        }

        #main {
            overflow: auto;
            padding: 20px;
            flex: 1;
        }

        .folder {
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .folder:hover {
            background: #ececec;
        }

        .children {
            margin-left: 15px;
            display: none;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 120px);
            gap: 20px;
        }

        .file-card {
            text-align: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
        }

        .file-card:hover {
            background: #f4f4f4;
        }

        .file-icon {
            font-size: 36px;
        }

        .icon-image {
            color: #0d6efd;
        }

        .icon-video {
            color: #dc3545;
        }

        .icon-text {
            color: #6c757d;
        }

        .filename {
            font-size: 12px;
            word-break: break-all;
            height: 36px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .file-card:focus {
            .filename {
                overflow: visible;
                -webkit-line-clamp: initial;
            }
        }
    </style>

</head>

        const imageExt = ["jpg", "png", "gif", "webp"]
        const videoExt = ["mp4", "mov", "avi", "webm"]
        const textExt = ["txt", "md", "log", "json"]

        const imageNames = [
            "cat portrait",
            "dog running",
            "bird flying",
            "ancient forest tree",
            "wide river landscape",
            "mountain sunset panorama",
            "dramatic storm cloud formation",
            "macro flower photography",
            "beautiful lake reflection scene"
        ]

        const videoNames = [
            "screen capture tutorial",
            "gameplay recording session",
            "product demo presentation",
            "long conference recording",
            "software feature walkthrough",
            "experimental camera footage"
        ]

        const textNames = [
            "project meeting notes",
            "technical documentation draft",
            "daily todo planning list",
            "final quarterly report",
            "system debug log archive",
            "random development ideas"
        ]

        const adjectives = [
            "very_long",
            "extremely detailed",
            "final version",
            "edited copy",
            "high resolution",
            "backup",
            "temporary",
            "experimental build",
            "archived",
            "draft revision"
        ]

        const connectors = [
            "_",
            " ",
            "_",
            " "
        ]

        function rand(arr) {
            return arr[Math.floor(Math.random() * arr.length)]
        }

        function randomSuffix() {

            const parts = []

            const extraWords = Math.floor(Math.random() * 4) + 2

            for (let i = 0; i < extraWords; i++) {
                parts.push(rand(adjectives))
            }

            return parts.join(rand(connectors))

        }

        function generateFlatList() {

            const assets = []

            for (let i = 1; i <= 200; i++) {

                let type = rand(["image", "video", "text"])

                let ext
                let name

                if (type === "image") {
                    ext = rand(imageExt)
                    name = rand(imageNames)
                }

                if (type === "video") {
                    ext = rand(videoExt)
                    name = rand(videoNames)
                }

                if (type === "text") {
                    ext = rand(textExt)
                    name = rand(textNames)
                }

                const connector = rand(connectors)

                const filename =
                    name +
                    connector +
                    randomSuffix() +
                    connector +
                    Math.floor(Math.random() * 100000)

                assets.push({
                    id: i,
                    path: rand(folders),
                    filename: filename + "." + ext
                })

            }

            return assets

        }

        /*
        ------------------------------------------
        BUILD FOLDER TREE
        ------------------------------------------
        */

        function buildTree(assets) {

            const tree = {}

            assets.forEach(asset => {

                const parts = asset.path.split("/").filter(Boolean)

                let current = tree

                parts.forEach(p => {

                    if (!current[p]) current[p] = {}

                    current = current[p]

                })

            })

            return tree

        }

        const folderTree = buildTree(assets)

        /*
        ------------------------------------------
        MAP FILES BY FOLDER
        ------------------------------------------
        */

        const folderFiles = {}

        assets.forEach(asset => {

            const folder = asset.path.replace(/\/$/, "")

            if (!folderFiles[folder]) folderFiles[folder] = []

            folderFiles[folder].push(asset)

        })

        /*
        ------------------------------------------
        FILE TYPE DETECTION
        ------------------------------------------
        */

        function getType(filename) {

            const ext = filename.split(".").pop().toLowerCase()

            if (imageExt.includes(ext)) return "image"
            if (videoExt.includes(ext)) return "video"

            return "text"

        }

        /*
        ------------------------------------------
        ICONS
        ------------------------------------------
        */

        function icon(type) {

            if (type === "image") return '<div class="file-icon icon-image">🖼</div>'
            if (type === "video") return '<div class="file-icon icon-video">🎬</div>'

            return '<div class="file-icon icon-text">📄</div>'

        }

        /*
        ------------------------------------------
        RENDER FILE GRID
        ------------------------------------------
        */

        function displayFiles(folder) {

            document.getElementById("folderTitle").innerText = folder

            const grid = document.getElementById("fileGrid")

            grid.innerHTML = ""

            const list = folderFiles[folder] || []

            let i = 0;
            list.forEach(asset => {

                const type = getType(asset.filename)

                const card = document.createElement("div")
                card.className = "file-card"
                card.tabIndex = i;

                card.innerHTML = `

${icon(type)}

<div class="filename" title="${asset.filename}">${asset.filename}</div>

`

                grid.appendChild(card)
                i++;
            })

        }

        /*
        ------------------------------------------
        RENDER SIDEBAR TREE
        ------------------------------------------
        */

        function renderTree(obj, parent, path = "") {

            Object.keys(obj).sort().forEach(key => {

                const full = path ? path + "/" + key : key

                const row = document.createElement("div")
                row.className = "folder"

                row.innerHTML = "📁 " + key

                const children = document.createElement("div")
                children.className = "children"

                row.onclick = (e) => {

                    e.stopPropagation()

                    children.style.display =
                        children.style.display === "block" ? "none" : "block"

                    displayFiles(full)

                }

                parent.appendChild(row)
                parent.appendChild(children)

                renderTree(obj[key], children, full)

            })

        }

        renderTree(folderTree, document.getElementById("sidebar"))
